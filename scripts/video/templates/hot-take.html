<!doctype html>
<!--
  Template: hot take / unpopular opinion (references/fyp-formats.md,
  comment bait). 12 seconds: the take, a poll that swings back and forth
  and lands on a tie, and "break the tie".

  The take should be about the work, defensible, and something the brand
  actually believes; never about people or groups. The poll is a visual,
  not data: only show percentages from a real poll you ran.
  Page conventions (canvas, safe area, timing vars, backgrounds, data-sfx
  cues, music, assets): see the comment at the top of promo.html.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500&family=TikTok+Sans:wght@500..900&family=Noto+Color+Emoji&family=Caveat:wght@700&display=block">
<style>
  :root {
    --bg: #0f0f13;
    --card: #1b1b22;
    --line: #2b2b35;
    --text: #f3f2ee;
    --muted: #9a99a4;
    --accent: #db7350;
    --on-accent: #121212;   /* text on the accent: whichever of white or near-black reads better on it (brand.js and compose.js set it for the brand's) */
    --ok: #3fbf7f;
    --bad: #e0605a;
    --warn: #e8b04a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: "Inter", "Liberation Sans", "Noto Color Emoji", sans-serif; color: var(--text); position: relative; }

  .glow { position: absolute; border-radius: 50%; filter: blur(120px); opacity: .55; }
  .g1 { width: 900px; height: 900px; background: #8f3832; left: -300px; top: -200px; animation: drift1 24s linear 0s both; }
  .g2 { width: 800px; height: 800px; background: #8f7032; right: -320px; bottom: -160px; animation: drift2 24s linear 0s both; }
  @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(260px, 520px); } }
  @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-220px, -600px); } }

  /* scenes: content kept inside the platform-UI safe zone */
  .scene { position: absolute; left: 90px; right: 150px; top: 330px; bottom: 470px;
           display: flex; flex-direction: column; justify-content: center;
           animation: sceneOut .35s ease-in var(--out, 999s) forwards; }
  @keyframes sceneOut { to { opacity: 0; transform: translateY(-60px); } }

  /* entrances; .gone also leaves at its own --out */
  .pop   { animation: popIn .5s cubic-bezier(.2,.9,.3,1.25) var(--in) both; }
  .rise  { animation: riseIn .45s cubic-bezier(.2,.8,.2,1) var(--in) both; }
  .slide { animation: slideIn .4s cubic-bezier(.2,.8,.2,1) var(--in) both; }
  .fade  { animation: fadeIn .4s ease-out var(--in) both; }
  .gone  { animation: fadeIn .35s ease-out var(--in) both, fadeOut .3s ease-in var(--out) forwards; }
  @keyframes popIn   { from { opacity: 0; transform: scale(.6) translateY(40px); } to { opacity: 1; transform: none; } }
  @keyframes riseIn  { from { opacity: 0; transform: translateY(70px); } to { opacity: 1; transform: none; } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(160px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; } }

  .huge { font-size: 132px; font-weight: 800; line-height: 1.02; letter-spacing: -4px; }
  .big  { font-size: 104px; font-weight: 800; line-height: 1.04; letter-spacing: -3px; }
  .mid  { font-size: 64px;  font-weight: 700; line-height: 1.12; letter-spacing: -1.5px; }
  .small{ font-size: 42px;  font-weight: 500; line-height: 1.3; color: var(--muted); }
  .label{ font-size: 34px;  font-weight: 700; letter-spacing: 4px; text-transform: uppercase; }
  .accent { color: var(--accent); }
  .center { text-align: center; align-items: center; }

  /* counts up from 0 to --to, starting at --in: <span class="count" style="--in:3s; --to:40"></span>
     (--for and --ease change its pace; add class "pct" for a % sign) */
  @property --n { syntax: '<integer>'; inherits: false; initial-value: 0; }
  .count { counter-reset: n var(--n); animation: countUp var(--for, 1.2s) var(--ease, cubic-bezier(.2,.8,.2,1)) var(--in) both; }
  .pct::after { content: '%'; }
  .count::before { content: counter(n); }
  @keyframes countUp { from { --n: 0; } to { --n: var(--to); } }

  /* background media: one photo or clip per scene, behind the text (see promo.html) */
  .bg { position: absolute; inset: 0; overflow: hidden; isolation: isolate; background: #000;
        animation: fadeIn .45s ease-out var(--in) both, fadeOut .45s ease-in var(--out, 999s) forwards; }
  .bg.now { animation: fadeOut .45s ease-in var(--out, 999s) forwards; }
  .bg:empty { display: none; }
  .bg-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0;
              object-position: var(--ox, 50%) var(--oy, 50%); transform-origin: var(--fx, 50%) var(--fy, 50%);
              filter: var(--grade, saturate(.9) contrast(1.05) brightness(.9));
              animation: var(--kb, kbIn) var(--dur, 8s) linear var(--in) both; }
  .bg.blur .bg-media { filter: var(--grade, saturate(.9) contrast(1.05) brightness(.9)) blur(var(--blur, 10px)); }
  @keyframes kbIn    { from { transform: scale(1.02); } to { transform: scale(1.14); } }
  @keyframes kbOut   { from { transform: scale(1.14); } to { transform: scale(1.02); } }
  @keyframes kbLeft  { from { transform: scale(1.14) translateX(3%); } to { transform: scale(1.14) translateX(-3%); } }
  @keyframes kbRight { from { transform: scale(1.14) translateX(-3%); } to { transform: scale(1.14) translateX(3%); } }
  .bg.tint::before { content: ''; position: absolute; inset: 0; z-index: 1; background: var(--accent); mix-blend-mode: soft-light; opacity: .5; }
  /* the user's screenshot on a screen in their photo: placed by compose.js from the screen's four corners,
     moving with the photo's own zoom */
  .bg-insert { position: absolute; inset: 0; z-index: 0; transform-origin: var(--fx, 50%) var(--fy, 50%); animation: var(--kb, kbIn) var(--dur, 8s) linear var(--in) both; }
  .bg-insert img { position: absolute; left: 0; top: 0; transform-origin: 0 0; filter: var(--grade, saturate(.9) contrast(1.05) brightness(.9)); }
  .bg::after { content: ''; position: absolute; inset: 0; z-index: 2;
               background: linear-gradient(to bottom, rgba(10,10,14,.72), rgba(10,10,14,.12) 30%, rgba(10,10,14,.22) 62%, rgba(10,10,14,.88)),
                           rgba(10,10,14,var(--shade, .35)); }
  body:has(.bg-media) { --muted: #d2d1d8; }
  body:has(.bg-media) .scene, body:has(.bg-media) .stage { text-shadow: 0 2px 6px rgba(0,0,0,.35), 0 4px 30px rgba(0,0,0,.55); }

  /* on screen from the very first frame, with a small settle instead of an entrance: for the
     hook, since the first frame is the default cover and the moment a viewer decides to stay */
  .now { animation: nowIn .5s cubic-bezier(.2,.8,.2,1) 0s both, fadeOut .3s ease-in var(--out, 999s) forwards; }
  @keyframes nowIn { from { transform: scale(1.05); } to { transform: none; } }

  /* the end card brand.js adds: the logo and handle, landing on the sonic logo */
  .endcard { position: absolute; left: 90px; right: 150px; top: 330px; bottom: 470px; z-index: 5;
             display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; text-align: center;
             animation: fadeIn .35s ease-out var(--in, 999s) both; }
  .endcard .logo { max-width: 380px; max-height: 300px; object-fit: contain; animation: popIn .55s cubic-bezier(.2,.9,.3,1.25) var(--in, 999s) both; }
  .endcard .handle { font-size: 60px; font-weight: 800; letter-spacing: -1px; animation: riseIn .45s cubic-bezier(.2,.8,.2,1) calc(var(--in, 999s) + .15s) both; }
  .endcard .line { font-size: 44px; font-weight: 700; line-height: 1.2; animation: riseIn .45s cubic-bezier(.2,.8,.2,1) calc(var(--in, 999s) + .3s) both; }
  .endcard .line + .line { margin-top: -22px; }
  .endcard .fine { max-width: 780px; font-size: 30px; font-weight: 600; line-height: 1.3; color: var(--muted); animation: fadeIn .4s ease-out calc(var(--in, 999s) + .4s) both; }

  /* ---- everyday / FYP kit ---- */
  body.fyp { font-family: "TikTok Sans", "Inter", "Liberation Sans", "Noto Color Emoji", sans-serif; text-wrap: pretty; }
  .fyp .huge, .fyp .big { letter-spacing: -2px; }
  .fyp .glow { opacity: .9; }
  .scene.top { justify-content: flex-start; }
  .scene.bottom { justify-content: flex-end; }
  .stack { display: grid; place-items: center; text-align: center; }
  .stack > * { grid-area: 1 / 1; }
  .swap { animation: popIn .45s cubic-bezier(.2,.9,.3,1.25) var(--in) both, fadeOut .25s ease-in var(--out, 999s) forwards; }
  body:has(.bg-media) :is(.cap, .sticker, .stamp, .say, .chat, .post, .reply, .notif, .popup, .cell, .tiers, .pane, .side) { text-shadow: none; }

  /* captions in the platforms' own style, each wrapped line boxed */
  .cap { font-size: 64px; font-weight: 700; line-height: 1.44; letter-spacing: -.5px; text-align: center; text-wrap: balance; }
  .cap > span { background: #fff; color: #121212; padding: .05em .32em; border-radius: .2em;
                -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .cap.dark > span { background: rgba(0,0,0,.76); color: #fff; }
  .cap.hl > span { background: var(--accent); color: var(--on-accent); }
  .cap.out { font-size: 82px; font-weight: 900; line-height: 1.12; color: #fff; paint-order: stroke fill; -webkit-text-stroke: 14px #000; }
  .cap.out > span { background: none; color: inherit; padding: 0; }
  .cap.left { text-align: left; }

  /* word-by-word captions: each <i> pops at its own --in, highlighted while it's the newest */
  .say { font-size: 80px; font-weight: 900; line-height: 1.16; text-align: center; color: #fff; text-wrap: balance;
         paint-order: stroke fill; -webkit-text-stroke: 14px #000; }
  .say i { font-style: normal; display: inline-block; color: var(--hi, #ffd23f);
           animation: wordIn .22s cubic-bezier(.2,1.5,.4,1) var(--in) both, wordDone .12s linear calc(var(--in) + .4s) forwards; }
  @keyframes wordIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
  @keyframes wordDone { to { color: #fff; } }

  /* the bold look (compose.js "captions: bold"): heavy capitals boxed in black, the script's
     *keywords* in yellow, a whole line on screen at once with each word popping as it's said,
     and the first line on screen from frame 0 (class "now"), which makes the cover */
  .bold .hook, .bold .say.line { text-transform: uppercase; }
  .bold .hook { font-size: 62px; font-weight: 900; line-height: 1.34; }
  .bold .hook > span { background: #0b0b0d; color: #fff; }
  /* the words carry their own black boxes, so photos keep their light: no darkening, a natural grade */
  body.bold { --grade: saturate(1.04) contrast(1.03); }
  .bold .bg::after { background: linear-gradient(to bottom, rgba(10,10,14,.45), rgba(10,10,14,0) 22%, rgba(10,10,14,0) 72%, rgba(10,10,14,.4)); }
  .bold .say.line { display: block; min-height: 0; font-size: 72px; font-weight: 900; line-height: 1.3; letter-spacing: -.5px;
                    -webkit-text-stroke: 0; animation: lineIn .2s ease-out var(--voice, 0s) both; }
  .bold .say.line.now { animation: none; }
  .bold .say.line > .ln { background: #0b0b0d; color: #fff; padding: .02em .26em .07em; border-radius: .2em;
                          -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .bold .say.line .cc { display: inline; animation: none; }
  .bold .say.line .cc i { color: #fff; animation: boldWord .3s ease-out var(--in) both; }
  .bold .kw, .bold .say.line .cc i.kw { color: var(--kw, #ffd23f); }
  /* a filmed take's captions (cut.js --bold) come a few words at a time, each chunk boxed the same way */
  .bold .say.auto:not(.line) { font-size: 70px; font-weight: 900; line-height: 1.24; text-transform: uppercase; -webkit-text-stroke: 0; }
  .bold .say.auto:not(.line) > .cc { width: fit-content; max-width: 100%; justify-self: center; background: #0b0b0d; color: #fff;
                                     padding: .04em .28em .08em; border-radius: .2em; }
  .bold .say.auto:not(.line) .cc i { color: #fff; animation: boldWord .3s ease-out var(--in) both; }
  .bold .say.auto:not(.line) .cc i.kw { color: var(--kw, #ffd23f); }
  @keyframes lineIn { from { opacity: 0; transform: translateY(24px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes boldWord { 40% { transform: translateY(-6px) scale(1.1); } }
  /* the quiet look (compose.js "captions: subtitle"), for a product demo: small white
     sentence-case subtitles low in the frame, a phrase at a time, nothing highlighted, so the
     screens carry the video */
  .sub .say { font-size: 46px; font-weight: 600; line-height: 1.32; letter-spacing: 0; -webkit-text-stroke: 0;
              text-shadow: 0 2px 3px rgba(0,0,0,.55), 0 3px 22px rgba(0,0,0,.6); }
  .sub .narr .say, .sub .say { min-height: 0; }
  .sub .say.auto .cc i { color: #fff; animation: none; }
  .sub .say.auto > .cc { animation: subIn .18s ease-out var(--in) both, ccOut .01s linear var(--out, 999s) forwards; }
  .sub .say.now > .cc:first-child { animation: ccOut .01s linear var(--out, 999s) forwards; } /* the first words are the cover */
  /* over a light set (the 3D studio), a soft dark backing keeps white subtitles readable */
  body.sub[data-tone="light"] .say.auto > .cc { width: fit-content; justify-self: center; background: rgba(14,14,18,.62); border-radius: .4em; padding: .06em .55em .1em; }
  @keyframes subIn { from { opacity: 0; } to { opacity: 1; } }
  /* a brand name and a series tag in the top corners ("week 2"), there for the whole video */
  .corner { position: absolute; top: 254px; z-index: 6; font-size: 44px; font-weight: 900; line-height: 1.1; text-transform: uppercase;
            color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.5), 0 4px 22px rgba(0,0,0,.45); animation: fadeOut .3s ease-in var(--out, 999s) forwards; }
  .corner.brand { left: 90px; }
  .corner.series { right: 150px; }

  /* labels and reactions */
  .sticker { width: fit-content; background: var(--accent); color: var(--on-accent); font-size: 44px; font-weight: 800; line-height: 1.2;
             padding: 10px 28px 12px; border-radius: 16px; rotate: -3deg; box-shadow: 0 12px 34px rgba(0,0,0,.35); }
  .sticker.yellow { background: #ffd23f; color: #121212; }
  .sticker.light { background: #fff; color: #121212; }
  .sticker.dark { background: #121212; color: #fff; }
  .stamp { width: fit-content; color: var(--accent); border: 12px solid currentColor; border-radius: 30px; background: rgba(10,10,14,.35);
           font-size: 124px; font-weight: 900; line-height: 1.12; letter-spacing: -2px; padding: 4px 36px 10px; rotate: -7deg;
           animation: stampIn .32s cubic-bezier(.3,1.5,.5,1) var(--in) both; }
  .stamp.ok { color: var(--ok); }
  .stamp.bad { color: var(--bad); }
  @keyframes stampIn { from { opacity: 0; transform: scale(2.4); } 50% { opacity: 1; } to { opacity: 1; transform: none; } }
  .emoji { width: fit-content; font-size: 190px; line-height: 1.12;
           animation: emojiIn .55s cubic-bezier(.2,1.5,.4,1) var(--in) both, sway 1.6s ease-in-out calc(var(--in) + .55s) infinite; }
  @keyframes emojiIn { from { opacity: 0; transform: scale(.2) rotate(-25deg); } to { opacity: 1; transform: none; } }
  @keyframes sway { 0%, 100% { rotate: -5deg; } 50% { rotate: 5deg; } }

  /* timers: a 3-2-1 ring and a draining bar, both running --for (default 3s) from --in */
  @property --sweep { syntax: '<angle>'; inherits: false; initial-value: 360deg; }
  @property --left { syntax: '<integer>'; inherits: false; initial-value: 3; }
  .ring { width: 270px; height: 270px; border-radius: 50%; display: grid; place-items: center;
          background: radial-gradient(closest-side, var(--bg) 84%, transparent 85%), conic-gradient(var(--accent) var(--sweep), rgba(255,255,255,.18) 0);
          animation: popIn .4s cubic-bezier(.2,.9,.3,1.25) var(--in) both, sweep var(--for, 3s) linear var(--in) both; }
  .ring b { font-size: 130px; font-weight: 900; line-height: 1; counter-reset: left var(--left);
            animation: left var(--for, 3s) steps(3, jump-none) var(--in) both; }
  .ring b::before { content: counter(left); }
  @keyframes sweep { from { --sweep: 360deg; } to { --sweep: 0deg; } }
  @keyframes left { from { --left: 3; } to { --left: 1; } }
  .timerbar { height: 20px; border-radius: 10px; background: rgba(255,255,255,.18); overflow: hidden; animation: fadeIn .2s ease-out var(--in) both; }
  .timerbar::after { content: ''; display: block; height: 100%; border-radius: inherit; background: var(--accent); transform-origin: left;
                     animation: drain var(--for, 3s) linear var(--in) both; }
  @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  /* bars: poll options grow to --pct, a progress bar fills to --pct over --for */
  .poll { display: flex; flex-direction: column; gap: 22px; }
  .opt { position: relative; display: flex; justify-content: space-between; align-items: center; height: 124px; padding: 0 38px;
         border-radius: 28px; background: rgba(255,255,255,.13); overflow: hidden; font-size: 52px; font-weight: 800;
         animation: fadeIn .3s ease-out var(--in) both; }
  .opt::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--pct, 50) * 1%); background: var(--accent);
                 animation: grow 1.2s cubic-bezier(.2,.8,.2,1) var(--in) both; }
  .opt.alt::before { background: #5c5b68; }
  .opt > * { position: relative; }
  @keyframes grow { from { width: 0; } }
  .progress { height: 70px; border-radius: 35px; background: rgba(255,255,255,.13); border: 3px solid rgba(255,255,255,.28); overflow: hidden;
              animation: fadeIn .3s ease-out var(--in) both; }
  .progress::before { content: ''; display: block; height: 100%; width: calc(var(--pct, 100) * 1%);
                      background: repeating-linear-gradient(-45deg, var(--accent) 0 26px, color-mix(in srgb, var(--accent) 78%, #fff) 26px 52px);
                      animation: grow var(--for, 3s) var(--ease, cubic-bezier(.15,.85,.25,1)) var(--in) both; }

  /* layouts: two stacked panes, a starter-pack grid, a tier list */
  .split { flex: 1; display: flex; flex-direction: column; gap: 24px; }
  .pane, .side { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 gap: 14px; text-align: center; padding: 100px 40px 44px; background: var(--card); }
  .pane { flex: 1; border-radius: 36px; border: 2px solid var(--line); }
  :is(.pane, .side) > .sticker { position: absolute; left: 30px; top: 28px; z-index: 3; }
  :is(.pane, .side, .cell) > :not(.bg-media, .sticker) { position: relative; z-index: 2; }
  :is(.pane, .side):has(> .bg-media)::after { content: ''; position: absolute; inset: 0; z-index: 1;
                                              background: linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.55)); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .cell { position: relative; overflow: hidden; background: #fff; color: #121212; border-radius: 28px; padding: 22px 18px 24px; text-align: center;
          font-size: 38px; font-weight: 700; line-height: 1.15; box-shadow: 0 16px 40px rgba(0,0,0,.3); rotate: -1.5deg; }
  .cell:nth-child(even) { rotate: 1.5deg; }
  .cell .e { font-size: 104px; line-height: 1.2; }
  .cell, .popup b { text-wrap: balance; }
  .tiers { display: flex; flex-direction: column; gap: 10px; }
  .tier { display: flex; min-height: 128px; background: rgba(22,22,28,.9); border-radius: 18px; overflow: hidden; }
  .tier > b { flex: none; width: 124px; display: grid; place-items: center; font-size: 64px; font-weight: 900; color: #121212; background: var(--t); }
  .tier.s { --t: #ff7f7f; } .tier.a { --t: #ffbf7f; } .tier.b { --t: #ffdf7f; } .tier.c { --t: #bfff7f; } .tier.d { --t: #7fbfff; }
  .items { flex: 1; display: flex; flex-wrap: wrap; align-content: center; gap: 12px; padding: 14px 16px; }
  .item { background: #fff; color: #121212; border-radius: 16px; padding: 10px 20px; font-size: 40px; font-weight: 700; white-space: nowrap; }

  /* a fictional chat: .msg.them / .msg.me, each a .bub, with .typing dots between --in and --out */
  .chat { background: #f4f3ef; color: #121212; border-radius: 44px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.5); }
  .chat-head { display: flex; align-items: center; gap: 22px; padding: 26px 32px; background: #fff; border-bottom: 2px solid #e6e3dc; }
  .chat-head b, .post-head b { display: block; font-size: 40px; font-weight: 800; line-height: 1.2; }
  .chat-head small, .post-head small { display: block; font-size: 28px; font-weight: 600; color: #8a8994; }
  .av { width: 84px; height: 84px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 46px; font-style: normal;
        background: linear-gradient(135deg, var(--accent), #6b3b4b); }
  .chat-body { display: flex; flex-direction: column; gap: 16px; padding: 30px 30px 40px; }
  .msg { display: grid; }
  .msg > * { grid-area: 1 / 1; }
  .msg.me { justify-items: end; }
  .msg.them { justify-items: start; }
  .bub { max-width: 600px; padding: 20px 30px 22px; border-radius: 36px; font-size: 42px; font-weight: 600; line-height: 1.25;
         animation: bubIn .35s cubic-bezier(.2,.9,.3,1.3) var(--in) both; }
  .them .bub { background: #e4e2dc; border-bottom-left-radius: 10px; transform-origin: 0 100%; }
  .me .bub { background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 10px; transform-origin: 100% 100%; }
  @keyframes bubIn { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: none; } }
  .typing { display: flex; gap: 10px; padding: 28px 30px; border-radius: 36px; background: #e4e2dc; width: fit-content;
            animation: fadeIn .2s ease-out var(--in) both, fadeOut .15s linear var(--out) forwards; }
  .typing i { width: 16px; height: 16px; border-radius: 50%; background: #8a8994; animation: dot 1s ease-in-out infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 30% { transform: translateY(-10px); opacity: .5; } }

  /* a lock screen: .notif cards slide in at --in, newest on top, pushing the rest down */
  .lock { display: flex; flex-direction: column; align-items: center; }
  .clock { font-size: 180px; font-weight: 700; letter-spacing: -6px; line-height: 1; }
  .date { font-size: 42px; font-weight: 600; margin: 8px 0 26px; }
  .notifs { align-self: stretch; display: flex; flex-direction: column-reverse; justify-content: flex-end; }
  .notif { display: flex; gap: 22px; align-items: flex-start; padding: 24px 28px; border-radius: 34px; overflow: hidden; text-align: left;
           background: rgba(246,245,241,.9); color: #121212; box-shadow: 0 16px 40px rgba(0,0,0,.25);
           animation: notifIn .5s cubic-bezier(.2,.9,.3,1.1) var(--in) both; }
  @keyframes notifIn { from { max-height: 0; padding-top: 0; padding-bottom: 0; margin-top: 0; opacity: 0; transform: scale(.9); }
                       to { max-height: 320px; margin-top: 18px; opacity: 1; transform: none; } }
  .app { width: 76px; height: 76px; flex: none; border-radius: 20px; display: grid; place-items: center; font-size: 44px; font-style: normal; background: #fff; }
  .notif > div { flex: 1; min-width: 0; }
  .n-head { display: flex; justify-content: space-between; font-size: 30px; font-weight: 800; }
  .n-head time { font-weight: 600; color: #6a6a74; }
  .notif p { font-size: 38px; font-weight: 600; line-height: 1.25; margin-top: 4px; }

  /* a generic social post (no real app's look) with a .heart that fills at --like, and .reply comments */
  .post { background: #fff; color: #121212; border-radius: 40px; padding: 34px 36px 26px; box-shadow: 0 40px 120px rgba(0,0,0,.45); }
  .post-head { display: flex; align-items: center; gap: 20px; margin-bottom: 22px; }
  .post-text { font-size: 52px; font-weight: 700; line-height: 1.2; }
  .post-bar { display: flex; gap: 44px; align-items: center; margin-top: 28px; padding-top: 22px; border-top: 2px solid #ecebe6;
              font-size: 34px; font-weight: 700; color: #6a6a74; }
  .post-bar > span { display: flex; align-items: center; gap: 12px; }
  .post-bar svg { width: 46px; height: 46px; }
  .heart { animation: beat .45s cubic-bezier(.2,1.6,.4,1) var(--like, 999s) both; }
  .heart path { fill: none; stroke: #6a6a74; stroke-width: 2.2; animation: liked .2s ease-out var(--like, 999s) forwards; }
  @keyframes beat { 40% { transform: scale(1.45); } }
  @keyframes liked { to { fill: #ff3b5c; stroke: #ff3b5c; } }
  .reply { display: flex; gap: 18px; align-items: flex-start; width: fit-content; max-width: 100%; margin-top: 18px; padding: 22px 28px;
           border-radius: 30px; background: rgba(255,255,255,.94); color: #121212; }
  .reply .av { width: 64px; height: 64px; font-size: 34px; }
  .reply b { display: block; font-size: 28px; color: #6a6a74; }
  .reply p { font-size: 38px; font-weight: 700; line-height: 1.22; }

  /* a generic system dialog */
  .popup { background: #f4f3ef; color: #121212; border-radius: 40px; padding: 40px 40px 32px; text-align: center; box-shadow: 0 40px 140px rgba(0,0,0,.6); }
  .popup .e { font-size: 100px; line-height: 1.15; }
  .popup b { display: block; font-size: 52px; font-weight: 800; line-height: 1.15; margin-top: 8px; }
  .popup p { font-size: 38px; font-weight: 600; color: #4a4a54; line-height: 1.3; margin-top: 12px; }
  .btns { display: flex; gap: 18px; margin-top: 30px; }
  .btns span { flex: 1; height: 96px; border-radius: 24px; display: grid; place-items: center; font-size: 36px; font-weight: 800; background: #e4e2dc; }
  .btns span:last-child { background: var(--accent); color: var(--on-accent); }

  /* before/after: the second .side wipes over the first at --at */
  .wipe { position: relative; flex: 1; border-radius: 40px; overflow: hidden; }
  .side { position: absolute; inset: 0; border-radius: inherit; }
  .side + .side { background: #2a2a34; clip-path: inset(0 100% 0 0);
                  animation: wipe .9s cubic-bezier(.7,0,.25,1) var(--at) both, show .01s linear var(--at) both; }
  .side:first-child { animation: fadeOut .01s linear calc(var(--at) + .9s) forwards; }
  .wipe::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 10px; margin-left: -5px; z-index: 5; background: #fff;
                 box-shadow: 0 0 30px rgba(0,0,0,.5); opacity: 0; animation: seam .9s cubic-bezier(.7,0,.25,1) var(--at) both; }
  @keyframes wipe { to { clip-path: inset(0 0 0 0); } }
  @keyframes show { from { opacity: 0; } to { opacity: 1; } }
  @keyframes seam { from { left: 0; opacity: 0; } 3% { opacity: 1; } 97% { opacity: 1; } to { left: 100%; opacity: 0; } }

  /* hits: a white flash over the frame at --in; a zoom-and-shake on whatever .hit wraps, at --hit */
  .flash { position: absolute; inset: 0; z-index: 20; background: #fff; pointer-events: none; animation: flash .45s ease-out var(--in) both; }
  @keyframes flash { 0% { opacity: 0; } 12% { opacity: .9; } 100% { opacity: 0; } }
  .hit { display: flex; flex-direction: column; align-items: inherit; animation: hit .5s linear var(--hit) both; }
  @keyframes hit { 0% { transform: none; } 12% { transform: scale(1.12) translate(-10px, 6px); } 24% { transform: scale(1.1) translate(12px, -8px); }
                   36% { transform: scale(1.09) translate(-8px, -4px); } 48% { transform: scale(1.07) translate(6px, 6px); } 100% { transform: scale(1.05); } }


  /* ---- editing: transitions, the camera, hits, and finishing ---- */

  /* transitions: a class on the incoming .bg slot (a crossfade is the default). Under all but
     the crossfade, the outgoing slot stays until the incoming one covers it: give it an --out of
     at least the incoming --in plus the transition's length (edit.js slotTimes does). */
  .bg.t-cut   { animation: fadeIn .01s linear var(--in) both, fadeOut .01s linear var(--out, 999s) forwards; }
  .bg.t-slide { animation: slideBg .5s cubic-bezier(.7,0,.25,1) var(--in) both, fadeOut .01s linear var(--out, 999s) forwards; }
  .bg.t-zoom  { animation: zoomBg .5s cubic-bezier(.2,.8,.2,1) var(--in) both, fadeOut .01s linear var(--out, 999s) forwards; }
  .bg.t-wipe  { animation: wipeBg .6s cubic-bezier(.7,0,.25,1) var(--in) both, fadeOut .01s linear var(--out, 999s) forwards; }
  /* a whip pan: the next picture flies in sideways, blurred with the speed */
  .bg.t-whip  { animation: whipBg .32s cubic-bezier(.6,0,.2,1) var(--in) both, fadeOut .01s linear var(--out, 999s) forwards; }
  /* a punch-in cut: a hard cut that lands zoomed in and snaps back */
  .bg.t-punch { animation: fadeIn .01s linear var(--in) both, punchBg .32s cubic-bezier(.2,.8,.2,1) var(--in) forwards, fadeOut .01s linear var(--out, 999s) forwards; }
  /* a glitch: the next picture tears in, in slices, its colors split (the RGB split filter is added by the script in <head>) */
  .bg.t-glitch { animation: fadeIn .01s linear var(--in) both, glitchBg .42s steps(1, end) var(--in) forwards, fadeOut .01s linear var(--out, 999s) forwards; }
  .bg.t-spin  { animation: spinBg .5s cubic-bezier(.2,.8,.2,1) var(--in) both, fadeOut .01s linear var(--out, 999s) forwards; }
  .bg.t-blur  { animation: blurBg .5s ease-out var(--in) both, fadeOut .01s linear var(--out, 999s) forwards; }
  /* a mask: the next picture opens out of a circle at --mx/--my */
  .bg.t-mask  { animation: maskBg .55s cubic-bezier(.6,0,.3,1) var(--in) both, fadeOut .01s linear var(--out, 999s) forwards; }
  .bg.t-leak  { animation: fadeIn .5s ease-out var(--in) both, fadeOut .01s linear var(--out, 999s) forwards; }
  @keyframes slideBg { from { transform: translateX(100%); } to { transform: none; } }
  @keyframes zoomBg  { from { opacity: 0; transform: scale(1.3); } to { opacity: 1; transform: none; } }
  @keyframes wipeBg  { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0); } }
  @keyframes whipBg  { from { translate: 100% 0; filter: blur(30px); } 65% { filter: blur(12px); } to { translate: 0 0; filter: none; } }
  @keyframes punchBg { from { scale: 1.24; } to { scale: 1; } }
  @keyframes glitchBg {
    0%   { filter: url(#fx-rgb); translate: -5% 0; clip-path: inset(8% 0 58% 0); }
    14%  { filter: url(#fx-rgb2); translate: 4% 0; clip-path: inset(46% 0 18% 0); }
    28%  { filter: url(#fx-rgb); translate: -2% 0; clip-path: inset(0); }
    42%  { filter: url(#fx-rgb2); translate: 3% 0; clip-path: inset(64% 0 6% 0); }
    56%  { filter: url(#fx-rgb); translate: -1% 0; clip-path: inset(0); }
    76%  { filter: url(#fx-rgb2); translate: .5% 0; clip-path: inset(0); }
    100% { filter: none; translate: 0 0; clip-path: inset(0); } }
  @keyframes spinBg  { from { opacity: 0; rotate: -28deg; scale: 1.7; filter: blur(14px); } to { opacity: 1; rotate: 0deg; scale: 1; filter: none; } }
  @keyframes blurBg  { from { opacity: 0; filter: blur(36px); scale: 1.06; } to { opacity: 1; filter: none; scale: 1; } }
  @keyframes maskBg  { from { clip-path: circle(0% at var(--mx, 50%) var(--my, 45%)); } to { clip-path: circle(120% at var(--mx, 50%) var(--my, 45%)); } }

  /* overlays dropped on a cut, over everything for a moment: .flash (above), a light leak, a film burn */
  .leak, .burn { position: absolute; inset: -10%; z-index: 20; pointer-events: none; mix-blend-mode: screen; opacity: 0; }
  .leak { background: radial-gradient(38% 30% at 22% 40%, rgba(255,166,77,.95), transparent 72%),
                      radial-gradient(42% 36% at 76% 62%, rgba(255,72,120,.75), transparent 72%),
                      radial-gradient(30% 24% at 50% 12%, rgba(255,226,150,.7), transparent 70%);
          animation: leak 1s ease-out var(--in) both; }
  @keyframes leak { 0% { opacity: 0; translate: -18% 0; } 30% { opacity: .95; } 100% { opacity: 0; translate: 16% 0; } }
  .burn { background: radial-gradient(55% 45% at 50% 52%, #fff 0%, rgba(255,226,170,.98) 30%, rgba(255,120,40,.85) 55%, rgba(160,20,0,.4) 72%, transparent 82%);
          animation: burn .75s ease-in-out var(--in) both; }
  @keyframes burn { 0% { opacity: 0; scale: .4; } 38% { opacity: 1; scale: 1.5; } 100% { opacity: 0; scale: 2.2; } }
  /* graphic transitions: shapes in the brand's colors cover the frame and hide the cut under them.
     .bars: three slanted bands sweep across; .blocks: tiles pop in and out in a diagonal wave.
     Each is dropped before the cut (edit.js overlayAt) so it covers the frame as the cut happens. */
  .bars, .blocks { position: absolute; inset: 0; z-index: 20; pointer-events: none; overflow: hidden; }
  .bars i { position: absolute; left: -30%; width: 160%; height: 35%; top: calc(var(--k) * 33%); background: var(--accent); transform: skewX(-14deg);
            animation: barSweep .6s cubic-bezier(.7,0,.3,1) calc(var(--in) + var(--k) * .03s) both; }
  .bars i:nth-child(2) { background: color-mix(in srgb, var(--accent) 45%, #fff); }
  .bars i:nth-child(3) { background: var(--bg); }
  @keyframes barSweep { from { translate: -110% 0; } 40%, 60% { translate: 0 0; } to { translate: 110% 0; } }
  .blocks i { position: absolute; width: calc(100% / 6 + 1px); height: calc(100% / 10 + 1px); left: calc(var(--c) * 100% / 6); top: calc(var(--r) * 100% / 10);
              background: var(--accent); animation: blockPop .8s cubic-bezier(.5,0,.5,1) calc(var(--in) + (var(--c) + var(--r)) * .02s) both; }
  body[data-size="1920x1080"] .blocks i { width: calc(100% / 10 + 1px); height: calc(100% / 6 + 1px); left: calc(var(--lc) * 10%); top: calc(var(--lr) * 100% / 6);
                                          animation-delay: calc(var(--in) + (var(--lc) + var(--lr)) * .02s); }
  .blocks i:nth-child(even) { background: color-mix(in srgb, var(--accent) 78%, #000); }
  @keyframes blockPop { from { scale: 0; rotate: 45deg; } 30%, 70% { scale: 1.04; rotate: 0deg; } to { scale: 0; rotate: -45deg; } }

  /* Ken Burns moves on a still, beside kbIn/kbOut/kbLeft/kbRight: kbDyn zooms with changing speed
     (slow, fast, slow), kbDynOut the reverse, kbUp and kbDown tilt */
  @keyframes kbDyn    { from { transform: scale(1.02); animation-timing-function: cubic-bezier(.7,0,.3,1); } to { transform: scale(1.2); } }
  @keyframes kbDynOut { from { transform: scale(1.2); animation-timing-function: cubic-bezier(.7,0,.3,1); } to { transform: scale(1.02); } }
  @keyframes kbUp     { from { transform: scale(1.14) translateY(3%); } to { transform: scale(1.14) translateY(-3%); } }
  @keyframes kbDown   { from { transform: scale(1.14) translateY(-3%); } to { transform: scale(1.14) translateY(3%); } }

  /* the camera: a layer around every background (<div class="cam">), so a punch-in or a shake
     moves the picture and never the words. Its animations (edit.js cameraAnimation, and the
     keyword punch-ins render.js adds once the words are timed) each start and end at rest. */
  .cam { position: absolute; inset: 0; overflow: hidden; isolation: isolate; transform-origin: var(--cam-x, 50%) var(--cam-y, 42%); }
  @keyframes camPunch { from { scale: var(--punch, 1.1); } to { scale: 1; } }
  @keyframes camKw { 0% { scale: 1; } 14% { scale: var(--punch, 1.08); } 72% { scale: var(--punch, 1.08); } 100% { scale: 1; } }
  /* a shake zooms in 4% while it moves, so the frame's edges never show; listed before a punch, so the punch's zoom wins */
  @keyframes camShake { 0% { translate: 0 0; rotate: 0deg; scale: 1.04; } 10% { translate: -14px 8px; rotate: -.6deg; } 22% { translate: 12px -10px; rotate: .5deg; }
                        34% { translate: -9px -6px; rotate: -.4deg; } 46% { translate: 7px 7px; rotate: .3deg; } 60% { translate: -4px 3px; rotate: -.15deg; scale: 1.03; }
                        78% { translate: 2px -2px; rotate: 0deg; } 100% { translate: 0 0; rotate: 0deg; scale: 1; } }
  @keyframes camGlitch { 0% { filter: url(#fx-rgb); translate: -2% 0; } 16% { filter: url(#fx-rgb2); translate: 2% 0; } 32% { filter: none; translate: 0 0; }
                         48% { filter: url(#fx-rgb); translate: -1% 0; } 64% { filter: url(#fx-rgb2); translate: .6% 0; } 80%, 100% { filter: none; translate: 0 0; } }

  /* the visual hook, in the first half second; frame 0 stays clean, since it's the cover:
     hk-zoom (a fast zoom toward the subject) on the first slot; hk-glitch, hk-shake, and
     hk-bounce (the hook's words swelling one after another) on the hook's text */
  .bg.now.hk-zoom { animation: hkZoom .42s cubic-bezier(.2,.9,.3,1) .02s both, fadeOut .45s ease-in var(--out, 999s) forwards; }
  @keyframes hkZoom { from { scale: 1; } to { scale: 1.16; } }
  .hook.hk-glitch > span { animation: hkGlitch .5s steps(1, end) .08s both; }
  @keyframes hkGlitch { 0% { text-shadow: none; translate: 0 0; } 1% { text-shadow: -6px 0 #ff2a6d, 6px 0 #05d9e8; translate: 4px 0; }
                        20% { text-shadow: 5px 0 #ff2a6d, -5px 0 #05d9e8; translate: -5px 0; } 40% { text-shadow: none; translate: 0 0; }
                        60% { text-shadow: -3px 0 #ff2a6d, 3px 0 #05d9e8; translate: 2px 0; } 80%, 100% { text-shadow: none; translate: 0 0; } }
  .hook.hk-shake { animation: hkJolt .5s linear .04s both; }
  @keyframes hkJolt { 0%, 100% { translate: 0 0; rotate: 0deg; } 12% { translate: -10px 4px; rotate: -1.5deg; } 26% { translate: 9px -5px; rotate: 1.2deg; }
                      40% { translate: -6px 2px; rotate: -.8deg; } 56% { translate: 4px -2px; rotate: .4deg; } 74% { translate: -2px 1px; rotate: 0deg; } }
  .hook.hk-bounce i { font-style: normal; display: inline-block; margin-inline: .05em; transform-origin: 50% 100%;
                      animation: hkWave .44s cubic-bezier(.3,1.3,.5,1) calc(.1s + var(--k, 0) * .07s) both; }
  @keyframes hkWave { 0% { scale: 1; translate: 0 0; } 45% { scale: 1.05; translate: 0 -16px; } 100% { scale: 1; translate: 0 0; } }

  /* finishing: film grain over the whole frame, a vignette over the pictures, and a color grade (--grade on the body element) */
  body.fx-grain::after { content: ''; position: absolute; inset: -60px; z-index: 30; pointer-events: none; opacity: .13; mix-blend-mode: overlay;
                         background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
                         animation: grain .5s steps(5) 0s infinite; }
  @keyframes grain { 0% { translate: 0 0; } 20% { translate: -30px 20px; } 40% { translate: 20px -40px; } 60% { translate: -40px -10px; } 80% { translate: 30px 30px; } 100% { translate: 0 0; } }
  .fx-vignette .cam::after { content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none;
                             background: radial-gradient(ellipse 78% 64% at 50% 46%, transparent 52%, rgba(0,0,0,.6) 100%); }


  /* ---- visual design: looks, text cards, sources, and color roles ---- */

  /* the headline font (a look's, or the Visual Identity's Headline font) on the hook and text cards */
  .has-head .hook > span, .has-head .bg-card b { font-family: var(--font-head); font-weight: var(--head-weight, 800); }

  /* looks (look.js, body class look-<name>): how the hook is set; the captions, grade, and textures come with them */
  :is(.look-documentary, .look-corporate) .hook > span { background: rgba(12,12,16,.8); color: #fff; }
  :is(.look-cinematic, .look-luxury, .look-suspense, .look-editorial, .look-retro, .look-handmade) .hook > span {
    background: none; color: #fff; padding: 0; text-shadow: 0 2px 6px rgba(0,0,0,.55), 0 6px 40px rgba(0,0,0,.6); }
  .look-cinematic .hook { font-size: 78px; line-height: 1.14; }
  .look-editorial .hook { font-size: 96px; line-height: 1.02; letter-spacing: -2px; text-align: left; }
  .look-luxury .hook { font-size: 46px; line-height: 1.7; letter-spacing: .2em; text-transform: uppercase; }
  .look-suspense .hook { font-size: 64px; line-height: 1.25; letter-spacing: .06em; text-transform: uppercase; }
  .look-tech .hook > span { background: rgba(8,14,20,.78); color: #e8fbff; box-shadow: inset 0 0 0 3px var(--accent), 0 0 26px color-mix(in srgb, var(--accent) 40%, transparent); }
  .look-retro .hook { font-size: 92px; line-height: 1.06; }
  .look-retro .hook > span { text-shadow: 3px 0 #ff2a6d, -3px 0 #05d9e8, 0 4px 20px rgba(0,0,0,.6); }
  .look-cozy .hook > span { background: #f6eedf; color: #3a2a1e; }
  .look-handmade .hook { font-size: 96px; line-height: 1.08; }
  .look-playful .hook > span { background: #ffd23f; color: #121212; }
  /* one accent, used consistently: in these looks the word being said and the *keywords* take the look's accent, not a second color */
  :is(.look-minimal, .look-editorial, .look-luxury, .look-tech, .look-retro, .look-cozy, .look-handmade) { --hi: var(--accent); --kw: var(--accent); }

  /* textures over the frame: VHS scanlines with a rolling tracking band, a faint grid at the edges, paper */
  body.tx-scanlines::before { content: ''; position: absolute; inset: 0; z-index: 29; pointer-events: none; mix-blend-mode: multiply;
                               background: repeating-linear-gradient(to bottom, rgba(0,0,0,.24) 0 2px, transparent 2px 5px); }
  .tx-scanlines .cam::before { content: ''; position: absolute; left: 0; right: 0; top: -12%; height: 9%; z-index: 4; pointer-events: none; mix-blend-mode: screen;
                                background: linear-gradient(transparent, rgba(255,255,255,.1), transparent); animation: tracking 7s linear 0s infinite; }
  @keyframes tracking { to { top: 110%; } }
  .tx-grid .cam::before { content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: .22;
                           background-image: linear-gradient(color-mix(in srgb, var(--accent) 75%, transparent) 2px, transparent 2px),
                                             linear-gradient(90deg, color-mix(in srgb, var(--accent) 75%, transparent) 2px, transparent 2px);
                           background-size: 90px 90px;
                           -webkit-mask-image: radial-gradient(ellipse 78% 66% at 50% 45%, transparent 40%, #000 100%);
                           mask-image: radial-gradient(ellipse 78% 66% at 50% 45%, transparent 40%, #000 100%); }
  .tx-paper .cam::before { content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none; mix-blend-mode: multiply; opacity: .5;
                            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.035' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .96 0 0 0 0 .92 0 0 0 0 .84 0 0 0 -.9 1.25'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"); }

  /* a text card ([card: ...] in compose.js): the line's key phrase, huge, on the brand's base color,
     in place of a picture; kept above the captions' band */
  .bg.card { background: var(--bg); }
  .bg.card::after { display: none; }
  .bg-card { position: absolute; left: 90px; right: 150px; top: 330px; bottom: 820px; display: flex; align-items: center; justify-content: center; text-align: center; }
  .bg-card b { font-weight: var(--head-weight, 900); font-size: var(--card-size, 132px); line-height: 1.04; letter-spacing: -.02em; color: var(--text); text-wrap: balance;
                animation: cardIn .55s cubic-bezier(.2,.9,.3,1.15) var(--in) both; }
  .bg-card .kw { color: var(--accent); }
  @keyframes cardIn { from { opacity: 0; translate: 0 40px; scale: .94; } to { opacity: 1; translate: 0 0; scale: 1; } }

  /* a source or caveat for a line's claim ([source: ...]): small but readable, up for the whole line */
  .source { align-self: flex-start; max-width: 100%; margin-bottom: auto; padding: 8px 20px 10px; border-radius: 12px; background: rgba(12,12,16,.74); color: #ecebf0;
             font-family: "Inter", "Liberation Sans", sans-serif; font-size: 36px; font-weight: 600; line-height: 1.25; text-align: left; text-shadow: none; }
  .narr > .hook:has(+ .source) { margin-bottom: 0; }
  .narr > .hook + .source { margin-top: 20px; }

  /* color roles: *keywords* (the key, the accent) and ~wrong~ (the wrong way, struck through in the caution color, so it doesn't rest on color alone) */
  .no { color: var(--bad); text-decoration: line-through .08em var(--bad); }
  .hook .no { text-decoration-thickness: .07em; }


  /* ---- graphics over the picture (graphics.js): one layer above the backgrounds and below the
     captions. Each .gx shows from its --in and fades at its --out, placed in the frame's pixels;
     --gc is its color (the accent unless color= says otherwise). ---- */
  .gx-layer { position: absolute; inset: 0; pointer-events: none; }
  .gx { position: absolute; --gc: var(--accent); text-shadow: none;
        animation: gxShow .01s linear var(--in, 0s) both, gxOut .3s ease-in var(--out, 999s) forwards; }
  @keyframes gxShow { from { visibility: hidden; } to { visibility: visible; } }
  @keyframes gxOut { to { opacity: 0; } }
  @keyframes gxFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes gxPop { from { opacity: 0; scale: .5; } 70% { opacity: 1; scale: 1.06; } to { opacity: 1; scale: 1; } }
  @keyframes gxDraw { to { stroke-dashoffset: 0; } }
  @keyframes gxGrowX { from { scale: 0 1; } to { scale: 1 1; } }
  @keyframes gxGrowY { from { scale: 1 0; } to { scale: 1 1; } }
  @keyframes gxWipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes gxRise { from { opacity: 0; translate: 0 30px; } to { opacity: 1; translate: 0 0; } }
  @keyframes gxSpin { to { rotate: 360deg; } }
  @keyframes gxBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .gx svg { position: absolute; overflow: visible; filter: drop-shadow(0 4px 10px rgba(0,0,0,.45)); }
  /* a stroke that draws itself (pathLength="1" on the shape) */
  .gx-draw { fill: none; stroke: var(--gc); stroke-width: 12; stroke-linecap: round; stroke-linejoin: round;
             stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: gxDraw .45s cubic-bezier(.6,0,.3,1) var(--in) both; }
  .gx-hi { color: var(--gc); }
  /* a callout's label: white, bold, popping in once its mark is drawn */
  .gx-tag { position: absolute; white-space: nowrap; padding: 12px 26px 14px; border-radius: 18px; background: #fff; color: #121212;
            font-size: 42px; font-weight: 800; line-height: 1.15; box-shadow: 0 14px 40px rgba(0,0,0,.3);
            animation: gxPop .4s cubic-bezier(.2,.9,.3,1.25) calc(var(--in) + .4s) both; }
  /* a *keyword* in a label: a marker stroke in the graphic's color under dark ink, readable whatever the color */
  .gx-tag .gx-hi { color: inherit; background: linear-gradient(transparent 60%, color-mix(in srgb, var(--gc) 60%, transparent) 60%); }
  .gx-tag.gx-up { translate: -50% calc(-100% - 14px); }
  .gx-tag.gx-down { translate: -50% 14px; }
  .gx-tag.gx-side { translate: 0 -50%; }
  .gx-tag.gx-side.gx-flip { translate: -100% -50%; }
  .gx-tag.gx-tab { translate: 0 calc(-100% - 14px); }
  .gx-tag.gx-tab.gx-below { translate: 0 14px; }

  /* lower third: a name and a title near the bottom of the picture, above the captions.
     bar (default): an accent bar and a dark panel; box: the name on the accent, the title on white;
     line: no panel, a rule drawn under the name; tech: a HUD panel with a monospace title */
  .gx-lower { left: 90px; bottom: 790px; display: flex; align-items: stretch; max-width: 820px; }
  .gx-lower.ls-right { left: auto; right: 150px; flex-direction: row-reverse; text-align: right; }
  body[data-size="1920x1080"] .gx-lower { left: 110px; bottom: 230px; max-width: 1100px; }
  body[data-size="1920x1080"] .gx-lower.ls-right { left: auto; right: 110px; }
  .gx-bar { flex: none; width: 14px; border-radius: 7px; background: var(--gc); transform-origin: 50% 100%;
            animation: gxGrowY .32s cubic-bezier(.2,.8,.2,1) var(--in) both; }
  .gx-lt { margin-left: 12px; padding: 16px 34px 20px 26px; border-radius: 0 20px 20px 0; background: rgba(12,12,16,.74);
           animation: gxWipe .5s cubic-bezier(.7,0,.25,1) calc(var(--in) + .12s) both; }
  .ls-right .gx-lt { margin: 0 12px 0 0; border-radius: 20px 0 0 20px; }
  .gx-lt b { display: block; font-size: 60px; font-weight: 800; line-height: 1.12; letter-spacing: -1px; color: #fff; }
  .gx-lt small { display: block; margin-top: 6px; font-size: 36px; font-weight: 600; line-height: 1.25; color: #e2e1e8;
                 animation: gxRise .4s cubic-bezier(.2,.8,.2,1) calc(var(--in) + .4s) both; }
  .ls-box .gx-bar, .ls-line .gx-bar, .ls-tech .gx-bar { display: none; }
  .ls-box .gx-lt { margin: 0; padding: 0; border-radius: 0; background: none; animation: none; display: flex; flex-direction: column; align-items: flex-start; }
  .ls-box.ls-right .gx-lt { align-items: flex-end; }
  .ls-box .gx-lt b { padding: 10px 26px 14px; background: var(--gc); color: var(--on-accent); animation: gxWipe .45s cubic-bezier(.7,0,.25,1) var(--in) both; }
  .ls-box .gx-lt b .gx-hi { color: inherit; }
  .ls-box .gx-lt small { margin-top: 0; padding: 8px 26px 10px; background: #fff; color: #121212; animation: gxWipe .45s cubic-bezier(.7,0,.25,1) calc(var(--in) + .18s) both; }
  .ls-line .gx-lt { margin: 0; padding: 0; border-radius: 0; background: none; text-shadow: 0 2px 6px rgba(0,0,0,.5), 0 6px 30px rgba(0,0,0,.5);
                    animation: gxFade .5s ease-out var(--in) both; }
  .ls-line .gx-lt b::after { content: ''; display: block; height: 6px; margin-top: 14px; border-radius: 3px; background: var(--gc); transform-origin: 0 50%;
                             animation: gxGrowX .6s cubic-bezier(.7,0,.25,1) calc(var(--in) + .1s) both; }
  .ls-line.ls-right .gx-lt b::after { transform-origin: 100% 50%; }
  .ls-tech .gx-lt { margin: 0; padding: 18px 34px 20px; border-radius: 4px; background: rgba(6,14,20,.82);
                    box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--gc) 60%, transparent), 0 0 30px color-mix(in srgb, var(--gc) 30%, transparent); }
  .ls-tech .gx-lt b { color: #eafcff; }
  .ls-tech .gx-lt small { font-family: "JetBrains Mono", "Liberation Mono", monospace; font-size: 30px; font-weight: 500; letter-spacing: .12em;
                          text-transform: uppercase; color: #bfe3ea; }

  /* callouts: an arrow drawn in to a point, a ring around it, a box around a region, a marker
     swipe, a spotlight, a pin. Their marks sit on a zero-size box at the point. */
  .gx-arrow, .gx-circle, .gx-pin, .gx-icon, .gx-shapes, .hv-lock { width: 0; height: 0; }
  .gx-arrow svg { transform-origin: 26px 200px; }
  .gx-arrow svg.a-ul { scale: -1 1; }
  .gx-arrow svg.a-dr { scale: 1 -1; }
  .gx-arrow svg.a-dl { scale: -1 -1; }
  .gx-arrow .gx-head { animation-duration: .16s; animation-delay: calc(var(--in) + .36s); }
  .gx-circle .gx-draw { stroke-width: 10; animation-duration: .6s; }
  .gx-box .gx-draw { stroke-width: 9; animation-duration: .6s; }
  .gx-highlight { --gc: #ffd84d; }
  .gx-mark { position: absolute; inset: 0; border-radius: 10px; background: color-mix(in srgb, var(--gc) 42%, transparent);
             box-shadow: 0 0 0 3px color-mix(in srgb, var(--gc) 70%, transparent); transform-origin: 0 50%;
             animation: gxGrowX .45s cubic-bezier(.6,0,.3,1) var(--in) both; }
  @property --sr { syntax: '<length>'; inherits: false; initial-value: 0px; }
  .gx-dim { position: absolute; inset: 0; --sr: var(--r);
            background: radial-gradient(circle at var(--px) var(--py), transparent calc(var(--sr) - 2px), rgba(4,4,8,.66) var(--sr));
            animation: gxSpot .6s cubic-bezier(.6,0,.3,1) var(--in) both; }
  @keyframes gxSpot { from { --sr: 1800px; opacity: 0; } 30% { opacity: 1; } to { --sr: var(--r); opacity: 1; } }
  .gx-dot { position: absolute; left: -20px; top: -20px; width: 40px; height: 40px; border-radius: 50%; background: #fff; border: 10px solid var(--gc);
            animation: gxPop .35s cubic-bezier(.2,.9,.3,1.3) var(--in) both; }
  .gx-dot::after { content: ''; position: absolute; inset: -24px; border-radius: 50%; border: 6px solid #fff; opacity: 0;
                   animation: gxPing 1.1s ease-out calc(var(--in) + .2s) 2; }
  @keyframes gxPing { from { opacity: .9; scale: .5; } to { opacity: 0; scale: 1.6; } }
  .gx-tag.gx-pintag { left: 40px; top: -100px; }
  .gx-tag.gx-pintag.gx-flip { left: auto; right: 40px; }
  .gx-tag.gx-pintag.gx-below { top: 40px; }

  /* motion graphics: an icon on a badge with a burst, and accents (a burst, rings, speed lines, dots, confetti) */
  .gx-badge { position: absolute; display: grid; place-items: center; border-radius: 50%; background: var(--gc); box-shadow: 0 16px 44px rgba(0,0,0,.35);
              animation: gxPop .45s cubic-bezier(.2,.9,.3,1.3) var(--in) both; }
  .gx .gx-badge svg { position: static; width: 58%; height: 58%; filter: none; }
  .gx-badge .gx-draw { stroke: var(--on-accent); stroke-width: 4.5; animation-duration: .4s; animation-delay: calc(var(--in) + .2s); }
  .gx-glyph { line-height: 1; font-family: "Noto Color Emoji", "Inter", sans-serif; font-weight: 800; color: var(--on-accent); }
  .ic-plain .gx-badge { background: none; box-shadow: none; }
  .gx.ic-plain .gx-badge svg { filter: drop-shadow(0 4px 12px rgba(0,0,0,.5)); }
  .ic-plain .gx-badge .gx-draw { stroke: #fff; stroke-width: 5.5; }
  .ic-plain .gx-glyph { color: #fff; }
  .gx-rays line { fill: none; stroke: var(--gc); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 1 1; stroke-dashoffset: 1;
                  animation: gxRay .55s cubic-bezier(.2,.8,.2,1) calc(var(--in) + var(--ray-at, 0s)) both; }
  @keyframes gxRay { from { stroke-dashoffset: 1; } 45% { stroke-dashoffset: 0; } to { stroke-dashoffset: -1; } }
  .gx-ring { position: absolute; border-radius: 50%; border: 7px solid var(--gc);
             animation: gxRingOut .9s cubic-bezier(.2,.8,.2,1) calc(var(--in) + var(--k) * .14s) both; }
  @keyframes gxRingOut { from { opacity: 0; scale: .1; } 8% { opacity: 1; } 70% { opacity: .8; } to { opacity: 0; scale: 1; } }
  .sh-lines, .sh-confetti { overflow: hidden; }
  .sh-lines i { position: absolute; left: 0; width: 70%; height: var(--t, 10px); border-radius: 99px; rotate: -12deg;
                background: linear-gradient(90deg, transparent, var(--gc) 35%, #fff 70%, transparent);
                animation: gxSweep .55s cubic-bezier(.5,0,.3,1) calc(var(--in) + var(--d)) both; }
  @keyframes gxSweep { from { translate: -110% 0; opacity: 0; } 15% { opacity: 1; } to { translate: 160% 0; opacity: 0; } }
  .sh-dots i { position: absolute; width: 20px; height: 20px; margin: -10px; border-radius: 50%; background: var(--gc);
               animation: gxDot .9s cubic-bezier(.2,.9,.3,1.3) calc(var(--in) + var(--d)) both; }
  @keyframes gxDot { from { opacity: 0; scale: 0; } 25% { opacity: 1; scale: 1.2; } 70% { opacity: 1; scale: 1; } to { opacity: 0; scale: 0; } }
  .sh-confetti i { position: absolute; top: -50px; width: var(--w); height: calc(var(--w) * .45); border-radius: 3px; background: var(--c);
                   animation: gxFall var(--t, 1.8s) cubic-bezier(.3,.1,.6,1) calc(var(--in) + var(--d)) both; }
  @keyframes gxFall { from { translate: 0 0; rotate: 0deg; } to { translate: var(--dx) var(--fall); rotate: var(--rot); } }

  /* kinetic type: big words animated in, in sync with the video. ta-<anim> sets how they come in,
     ts-<size> how big; gt-box sets each word on a white box, gt-outline in outline */
  .gx-text { translate: -50% -50%; text-align: center; }
  .gx-tx { font-weight: var(--head-weight, 900); line-height: 1.06; letter-spacing: -.02em; color: #fff; text-wrap: balance;
           text-shadow: 0 3px 8px rgba(0,0,0,.45), 0 10px 50px rgba(0,0,0,.55); }
  .has-head .gx-tx { font-family: var(--font-head); }
  .ts-s .gx-tx { font-size: 72px; }
  .ts-m .gx-tx { font-size: 100px; }
  .ts-l .gx-tx { font-size: 132px; }
  .ts-xl .gx-tx { font-size: 172px; }
  body[data-size="1920x1080"] .ts-l .gx-tx { font-size: 116px; }
  body[data-size="1920x1080"] .ts-xl .gx-tx { font-size: 150px; }
  .gx-w { display: inline-block; white-space: nowrap; margin: .02em .1em; }
  .gt-box .gx-w { padding: .02em .16em .08em; border-radius: .12em; background: #fff; color: #121212; text-shadow: none; }
  .gt-box .gx-w.gx-hi { background: var(--gc); color: var(--on-accent); }
  .gt-outline { color: transparent; -webkit-text-stroke: .035em #fff; text-shadow: none; }
  .gt-outline .gx-hi { color: transparent; -webkit-text-stroke-color: var(--gc); }
  .ta-pop .gx-w { animation: gxPop .4s cubic-bezier(.2,.9,.3,1.3) calc(var(--in) + var(--k) * .12s) both; }
  .ta-slam .gx-w { animation: gxSlam .3s cubic-bezier(.3,.7,.3,1) calc(var(--in) + var(--k) * .14s) both; }
  @keyframes gxSlam { from { opacity: 0; scale: 2.8; filter: blur(8px); } 65% { opacity: 1; scale: .95; filter: blur(0); } to { opacity: 1; scale: 1; filter: none; } }
  .ta-slam .gx-tx { animation: hkJolt .4s linear calc(var(--in) + .24s) both; }
  .ta-type .gx-c { animation: gxFade .01s linear calc(var(--in) + var(--c) * .045s) both; }
  .ta-rise .gx-w { overflow: hidden; padding: 0 .02em .1em; vertical-align: top; }
  .ta-rise .gx-c { display: inline-block; animation: gxUp .5s cubic-bezier(.2,.8,.2,1) calc(var(--in) + var(--c) * .028s) both; }
  @keyframes gxUp { from { translate: 0 110%; opacity: 0; } 30% { opacity: 1; } to { translate: 0 0; opacity: 1; } }
  .ta-wave .gx-c { display: inline-block; animation: gxWave .5s cubic-bezier(.3,1.4,.5,1) calc(var(--in) + var(--c) * .035s) both; }
  @keyframes gxWave { from { opacity: 0; translate: 0 60px; scale: .6; } to { opacity: 1; translate: 0 0; scale: 1; } }
  .ta-stretch .gx-tx { animation: gxStretch .6s cubic-bezier(.2,.9,.3,1.15) var(--in) both; }
  @keyframes gxStretch { from { opacity: 0; scale: .15 1.5; letter-spacing: .5em; } to { opacity: 1; scale: 1 1; letter-spacing: -.02em; } }
  .ta-glitch .gx-tx { animation: gxFade .01s linear var(--in) both, hkGlitch .5s steps(1, end) var(--in) both; }
  .ta-count .gx-tx { animation: gxPop .4s cubic-bezier(.2,.9,.3,1.3) var(--in) both; }
  /* a number counting up (graphics.js countHtml): the count, then the figure as written, commas and all */
  .gx-num { display: inline-grid; font-variant-numeric: tabular-nums; }
  .gx-num > * { grid-area: 1 / 1; text-align: left; }
  .gx-num .count { animation: countUp var(--for, 1.2s) cubic-bezier(.2,.8,.2,1) calc(var(--in) + var(--d, 0s)) both,
                               fadeOut .01s linear calc(var(--in) + var(--d, 0s) + var(--for, 1.2s)) forwards; }
  .gx-num .gx-final { animation: gxFade .01s linear calc(var(--in) + var(--d, 0s) + var(--for, 1.2s)) both; }

  /* HUD: a targeting reticle locking on (hv-lock), a frame around the picture (hv-frame), a data
     panel (hv-data), and a scan over a region (hv-scan), in light monospace with accent lines */
  .gx-hud { color: #eafcff; font-family: "JetBrains Mono", "Liberation Mono", monospace; }
  .gx-hb { position: absolute; width: 46px; height: 46px; border: 0 solid var(--gc);
           animation: gxClose .5s cubic-bezier(.2,.8,.2,1) var(--in) both; }
  .gx-hb.c-tl { border-width: 7px 0 0 7px; }
  .gx-hb.c-tr { border-width: 7px 7px 0 0; }
  .gx-hb.c-bl { border-width: 0 0 7px 7px; }
  .gx-hb.c-br { border-width: 0 7px 7px 0; }
  @keyframes gxClose { from { opacity: 0; translate: calc(var(--sx) * 110px) calc(var(--sy) * 110px); } 50% { opacity: 1; } to { opacity: 1; translate: 0 0; } }
  .gx-orbit { animation: gxFade .3s ease-out calc(var(--in) + .3s) both, gxSpin 7s linear var(--in) infinite; }
  .gx-orbit circle { fill: none; stroke: var(--gc); stroke-width: 4; stroke-dasharray: 18 12; opacity: .85; }
  .gx-cross { animation: gxFade .2s linear calc(var(--in) + .45s) both; }
  .gx-cross line { stroke: var(--gc); stroke-width: 4; stroke-linecap: round; }
  .gx-pip { position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 50%; background: var(--gc);
            animation: gxFade .01s linear calc(var(--in) + .45s) both, gxBlink .7s steps(1) calc(var(--in) + .45s) infinite; }
  .gx-read { position: absolute; white-space: nowrap; padding: 10px 20px 12px; background: rgba(6,12,18,.74); border-left: 6px solid var(--gc);
             animation: gxWipe .4s steps(12, end) calc(var(--in) + .5s) both; }
  .gx-read.gx-flip { border-left: 0; border-right: 6px solid var(--gc); text-align: right; }
  .gx-read b { display: block; font-size: 34px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
  .gx-read small { display: block; margin-top: 4px; font-size: 24px; letter-spacing: .14em; color: #a9c4cc; }
  .gx-deco { position: absolute; inset: 0; }
  .hv-frame .gx-hb, .hv-scan .gx-hb { width: 90px; height: 90px; }
  .hv-scan .gx-hb { width: 60px; height: 60px; }
  .hv-frame .gx-hb.c-tl, .hv-scan .gx-hb.c-tl { left: 0; top: 0; }
  .hv-frame .gx-hb.c-tr, .hv-scan .gx-hb.c-tr { right: 0; top: 0; }
  .hv-frame .gx-hb.c-bl, .hv-scan .gx-hb.c-bl { left: 0; bottom: 0; }
  .hv-frame .gx-hb.c-br, .hv-scan .gx-hb.c-br { right: 0; bottom: 0; }
  .gx-ruler { position: absolute; left: 26px; top: 22%; bottom: 22%; width: 26px; opacity: .8;
              background: repeating-linear-gradient(to bottom, var(--gc) 0 3px, transparent 3px 30px);
              -webkit-mask-image: linear-gradient(transparent, #000 15%, #000 85%, transparent); mask-image: linear-gradient(transparent, #000 15%, #000 85%, transparent);
              animation: gxFade .5s ease-out calc(var(--in) + .3s) both; }
  .gx-sweep { position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--gc); opacity: 0;
              box-shadow: 0 0 24px 6px color-mix(in srgb, var(--gc) 60%, transparent);
              animation: gxScan 1.2s cubic-bezier(.4,0,.6,1) calc(var(--in) + .1s) both; }
  @keyframes gxScan { from { top: 0%; opacity: 0; } 10%, 90% { opacity: 1; } to { top: 100%; opacity: 0; } }
  .gx-htop { position: absolute; left: 30px; top: 26px; display: flex; align-items: center; gap: 16px;
             font-size: 32px; letter-spacing: .14em; text-transform: uppercase; text-shadow: 0 2px 8px rgba(0,0,0,.6);
             animation: gxWipe .5s steps(14, end) calc(var(--in) + .3s) both; }
  .gx-htop b { font-weight: 500; }
  .gx-rec { width: 22px; height: 22px; border-radius: 50%; background: #ff3b3b; animation: gxBlink 1s steps(1) var(--in) infinite; }
  .hv-data { min-width: 440px; max-width: 760px; padding: 26px 32px 28px; border-radius: 6px; background: rgba(6,12,18,.78);
             box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--gc) 50%, transparent), 0 20px 50px rgba(0,0,0,.35);
             animation: gxShow .01s linear var(--in) both, gxPanel .4s cubic-bezier(.2,.8,.2,1) var(--in) both, gxOut .3s ease-in var(--out, 999s) forwards; }
  @keyframes gxPanel { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
  .hv-data h6 { margin-bottom: 14px; font-size: 26px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: #bfe3ea; }
  .gx-row { animation: gxRise .4s cubic-bezier(.2,.8,.2,1) calc(var(--in) + .25s + var(--k) * .22s) both; }
  .gx-row + .gx-row { margin-top: 18px; }
  .gx-k { display: block; font-size: 26px; letter-spacing: .14em; text-transform: uppercase; color: #a9c4cc; }
  .gx-v { display: block; font-family: "Inter", "Liberation Sans", sans-serif; font-size: 64px; font-weight: 800; line-height: 1.08; color: #fff; }
  .gx-meter { display: block; height: 12px; margin-top: 10px; border-radius: 6px; background: rgba(255,255,255,.14); overflow: hidden; }
  .gx-meter i { display: block; width: var(--pct); height: 100%; background: var(--gc); transform-origin: 0 50%;
                animation: gxGrowX .9s cubic-bezier(.2,.8,.2,1) calc(var(--in) + .35s + var(--k) * .22s) both; }
